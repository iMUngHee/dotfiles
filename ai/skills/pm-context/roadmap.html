<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pm · roadmap</title>
<style>
  :root{
    --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f0f4f8; --border:#e4e9ef; --border-strong:#d3dbe3;
    --text:#1a2430; --muted:#5b6b7a; --faint:#98a4b2;
    --accent:#0d9488; --accent-strong:#0f766e; --accent-weak:#e6f4f2; --accent-line:#a7ddd6;
    --p0:#b42318; --p1:#b54708; --p2:#92600a; --p3:#475467;
    --ok:#16a34a; --warn:#b54708; --err:#b42318;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow-md:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 48px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 14px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  button:hover{color:var(--accent);border-color:var(--accent-line)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;box-shadow:var(--shadow-sm)}
  button.primary:hover{background:var(--accent-strong);color:#fff}
  button.danger:hover{color:var(--err);border-color:#f4c4bf}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible,[role=link]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,textarea{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:7px;padding:7px 9px;width:100%}
  textarea{resize:vertical;min-height:44px;line-height:1.5}
  .mono{font-family:var(--mono)}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 7px;letter-spacing:.02em;border-radius:5px;white-space:nowrap}
  .chip.p0{color:var(--p0);background:#fef3f2;border:1px solid #fecdc9}
  .chip.p1{color:var(--p1);background:#fff6ed;border:1px solid #fdddb0}
  .chip.p2{color:var(--p2);background:#fffaeb;border:1px solid #fee38a}
  .chip.p3{color:var(--p3);background:#f2f4f7;border:1px solid #e2e7ee}
  /* header */
  header{display:flex;align-items:center;justify-content:space-between;height:60px;border-bottom:1px solid var(--border);margin-bottom:26px}
  .brand{font-size:14px;letter-spacing:.01em;color:var(--muted);display:flex;align-items:center}
  .brand b{color:var(--text);font-weight:700}
  .crumb{color:var(--faint)} .crumb a:hover{color:var(--accent)}
  .tasklink{color:var(--accent-strong);border-bottom:1px solid transparent} .tasklink:hover{border-bottom-color:var(--accent-line)}
  .owners{display:flex;flex-wrap:wrap;gap:8px}
  .ochip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 12px;box-shadow:var(--shadow-sm)}
  .ochip .odot{width:7px;height:7px;border-radius:50%;background:var(--accent)} .ochip b{color:var(--text)}
  .proj{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--muted);border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 8px;margin-left:12px}
  .htools{display:flex;align-items:center;gap:12px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .pill.has-err{color:var(--warn);border-color:#fee38a} .pill.has-err .dot{background:var(--warn)}
  /* conflict / error banner */
  #banner{margin-bottom:16px}
  .banner{border:1px solid #f4c4bf;background:#fef3f2;color:#912018;border-radius:9px;padding:11px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap;box-shadow:var(--shadow-sm)}
  .banner .k{color:var(--err);font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none}
  .banner button{margin-left:auto;flex:none;border:none;padding:2px 8px;background:none}
  /* dock — next-up carried by an accent rail + elevation + reserved CTA (structural, not type scale) */
  .dock{position:relative;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:18px 22px 18px;margin-bottom:26px;box-shadow:var(--shadow-md)}
  .dock .rlabel{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-strong);font-weight:600;margin-bottom:12px}
  .dock .rlabel .live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .dock .body{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:start}
  .dock .main{min-width:0}
  .dock .line1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .dock .id{font-family:var(--mono);font-size:16px;color:var(--text);font-weight:600}
  .dock .id a:hover{color:var(--accent)}
  .dock .title{font-size:14px;color:var(--muted)}
  .dock .meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:6px;letter-spacing:.02em}
  .dock .actions{display:flex;flex-direction:column;gap:8px;min-width:160px}
  .nextstep{font-family:var(--mono);font-size:12px;color:var(--accent-strong);background:var(--accent-weak);border-radius:7px;padding:7px 11px;margin:13px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nextstep .k{color:var(--accent);font-weight:600}
  /* section labels + queue */
  .seclabel{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
  .seclabel .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .seclabel .cnt{font-size:11px;color:var(--faint);letter-spacing:.04em}
  .rows{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
  .row{display:grid;grid-template-columns:16px 44px minmax(0,220px) 1fr 150px;align-items:center;gap:13px;min-height:38px;padding:0 14px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--surface-2)} .row:hover .tick{color:var(--accent)}
  .row .tick{color:var(--faint);font-size:11px}
  .row .rid{font-family:var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rtitle{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rtask{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .subhead{font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;font-weight:600;margin:20px 2px 8px}
  .row.blocked{opacity:.6;cursor:default} .row.blocked:hover{background:var(--surface)}
  /* footer chips */
  .foot{display:flex;gap:12px;margin-top:22px}
  .fchip{flex:1;font-size:12px;color:var(--muted);padding:12px 15px;border:1px solid var(--border);border-radius:10px;background:var(--surface);letter-spacing:.02em;text-align:left;cursor:pointer;box-shadow:var(--shadow-sm)}
  .fchip:hover{border-color:var(--accent-line);color:var(--text)}
  .fchip b{color:var(--text);font-weight:700;font-size:15px} .fchip .lbl{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .fchip .ok{color:var(--ok)} .fchip .warn{color:var(--warn)}
  /* empty / mono cli hint */
  .empty{padding:26px 6px;color:var(--muted);font-size:12.5px}
  .empty .cli{display:inline-block;margin-top:8px;color:var(--accent-strong);background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:7px;padding:6px 10px}
  /* skeleton */
  .sk{height:38px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#eef2f6,#f7f9fb,#eef2f6);background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* detail / task views */
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .toolbar .grp{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .toolbar .id{font-family:var(--mono);font-size:15px;color:var(--text);font-weight:600}
  .tabs{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;width:fit-content;margin-bottom:18px;background:var(--surface);box-shadow:var(--shadow-sm)}
  .tabs button{border:none;border-right:1px solid var(--border);border-radius:0;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;padding:9px 16px;background:none}
  .tabs button:last-child{border-right:none}
  .tabs button[aria-selected=true]{color:var(--accent-strong);background:var(--accent-weak);font-weight:600}
  .card{border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px;background:var(--surface);box-shadow:var(--shadow-sm)}
  .card h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;font-size:12.5px}
  .kv dt{color:var(--faint);letter-spacing:.04em;text-transform:uppercase;font-size:10px;padding-top:2px}
  .kv dd{margin:0;color:var(--text);word-break:break-word}
  .kv dd.mut{color:var(--muted)}
  .by{font-family:var(--mono);font-size:9px;color:var(--accent-strong);background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:4px;padding:1px 5px;margin-left:8px;letter-spacing:.04em}
  .edit-row{border:1px solid var(--border);border-radius:9px;padding:13px;margin-bottom:11px;display:grid;gap:9px;background:var(--surface)}
  .edit-row .head{display:flex;align-items:center;gap:8px}
  .edit-row .head input{font-weight:600}
  .edit-row label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
  .prose{font-size:12.5px;color:var(--muted);line-height:1.55;white-space:pre-wrap;word-break:break-word;padding:8px 0;border-bottom:1px solid var(--border)}
  .prose:last-child{border-bottom:none}
  .datehint{color:var(--faint);font-size:10.5px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:900px){.wrap{padding:0 16px}.row{grid-template-columns:16px 40px 1fr 92px}.row .rtitle{display:none}.kv{grid-template-columns:1fr}.dock .body{grid-template-columns:1fr;gap:16px}.dock .actions{flex-direction:row;flex-wrap:wrap;min-width:0}.foot{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand"><b>pm</b>&nbsp;·&nbsp;roadmap</div>
    <div class="htools"><span class="pill" id="validate" role="button" tabindex="0" title="validation health"><span class="dot"></span><span id="validate-txt">validate</span></span></div>
  </header>
  <div id="banner" aria-live="assertive"></div>
  <main id="app"></main>
</div>

<script type="module">
const app = document.getElementById("app");
const bannerBox = document.getElementById("banner");
const brand = document.getElementById("brand");

/* ---------- DOM helper (textContent-only → XSS-safe) ---------- */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(n.dataset, v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
const pchip = (p) => el("span", { class: "chip " + (p || "p3").toLowerCase(), text: p || "P?" });
// nextStep is a plan's first unchecked step verbatim (may carry markdown **bold**/`code` and a trailing "(PASS: …)" plan tag) — strip for display.
const cleanStep = (s) => (s ? s.replace(/\*\*/g, "").replace(/`/g, "").replace(/\s*\((?:PASS|FAIL)[:：].*$/i, "").trim() : s);

/* ---------- API (no optimistic UI; 409/errors surfaced verbatim) ---------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("application/json") ? await res.json() : await res.text();
  if (!res.ok) {
    const msg = (body && typeof body === "object" && body.error) ? body.error : (typeof body === "string" && body ? body : res.statusText);
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return body;
}
function showConflict(e) {
  const kind = e.status === 409 ? "conflict" : "error";
  bannerBox.replaceChildren(el("div", { class: "banner", role: "alert" },
    el("span", { class: "k", text: kind }),
    el("span", { text: e.message || String(e) }),
    el("button", { text: "dismiss", onclick: () => bannerBox.replaceChildren() })));
}
const clearBanner = () => bannerBox.replaceChildren();

/* after a successful mutation: refetch by re-running the router (no optimistic patching) */
async function mutate(fn) {
  clearBanner();
  try { await fn(); await route(); }
  catch (e) { showConflict(e); }
}
async function copyKickoff(id) {
  clearBanner();
  try {
    const text = await api(`/api/roadmap/${id}/next`);
    await navigator.clipboard.writeText(text);
    flashPill(`kickoff copied · /design ${id}`);
  } catch (e) { showConflict(e); }
}
let flashTimer;
function flashPill(msg) {
  const t = document.getElementById("validate-txt"); if (!t) return;
  const prev = t.textContent; t.textContent = msg;
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { t.textContent = prev; }, 2200);
}

/* ---------- shared bits ---------- */
function setCrumb(...parts) {
  brand.replaceChildren(el("b", { text: "pm" }), document.createTextNode(" · "),
    parts.length ? el("a", { href: "#/", class: "crumb", text: "roadmap" }) : el("span", { text: "roadmap" }));
  for (const p of parts) { brand.append(document.createTextNode(" · ")); brand.append(p && typeof p === "object" ? el("a", { href: p.href, class: "crumb", text: p.text }) : el("span", { class: "crumb", text: p })); }
}
async function loadValidate() {
  const pill = document.getElementById("validate");
  try {
    const v = await api("/api/roadmap/validate");
    const errs = (v.errors || []).length, warns = (v.warnings || []).length;
    pill.classList.toggle("has-err", errs > 0 || warns > 0);
    document.getElementById("validate-txt").textContent = errs ? `${errs} error${errs > 1 ? "s" : ""}` : warns ? `${warns} warn` : "0 errors";
  } catch { /* leave default */ }
}
function skeletonRows(n = 3) { return el("div", { class: "rows" }, Array.from({ length: n }, () => el("div", { class: "sk" }))); }

/* ---------- HOME (operating view) ---------- */
async function renderHome() {
  setCrumb();
  app.replaceChildren(el("div", {}, el("div", { class: "seclabel" }, el("span", { class: "lbl", text: "loading" })), skeletonRows()));
  loadValidate();
  let roadmap, next;
  try { [roadmap, next] = await Promise.all([api("/api/roadmap"), api("/api/next")]); }
  catch (e) { app.replaceChildren(el("div", { class: "empty" }, "failed to load roadmap — ", el("button", { text: "retry", onclick: route }), el("div", { text: e.message }))); return; }

  brand.replaceChildren(el("b", { text: "pm" }), document.createTextNode(" · roadmap"), roadmap.project ? el("span", { class: "proj", text: roadmap.project.replace(/^\./, "") }) : null);
  const open = roadmap.open || [];
  const dockId = roadmap.focus || (next.eligible && next.eligible[0] && next.eligible[0].id) || null;
  const dockItem = dockId ? open.find((o) => o.id === dockId) : null;
  const frag = document.createDocumentFragment();

  /* dock */
  if (dockItem) {
    const focused = !!roadmap.focus;
    const actions = el("div", { class: "actions" },
      el("button", { class: "primary", text: "copy kickoff →", onclick: () => copyKickoff(dockItem.id) }),
      focused
        ? el("button", { text: "clear focus", onclick: () => mutate(() => api("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: "" }) })) })
        : el("button", { text: "focus", onclick: () => mutate(() => api("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: dockItem.id }) })) }),
      el("button", { text: "open →", onclick: () => { location.hash = `#/item/${dockItem.id}`; } }));
    frag.append(el("section", { class: "dock", "aria-label": focused ? "focused item" : "next up" },
      el("div", { class: "rlabel" }, el("span", { class: "live" }), focused ? "Focus" : "Next up"),
      el("div", { class: "body" },
        el("div", { class: "main" },
          el("div", { class: "line1" }, pchip(dockItem.priority),
            el("span", { class: "id" }, el("a", { href: `#/item/${dockItem.id}`, text: dockItem.id })),
            el("span", { class: "title", text: dockItem.title })),
          el("div", { class: "meta" }, "task · ", el("a", { href: `#/task/${dockItem.task}`, class: "tasklink", text: dockItem.task }), (dockItem.owner && dockItem.mode === "collab") ? ` · @${dockItem.owner}` : ""),
          dockItem.nextStep
            ? el("div", { class: "nextstep", title: cleanStep(dockItem.nextStep) }, el("span", { class: "k", text: "→ next  " }), cleanStep(dockItem.nextStep))
            : el("div", { class: "nextstep" }, el("span", { class: "k", text: "→  " }), el("span", { text: dockItem.plan ? "plan set · no open step — /verify or /retro" : `no plan · kickoff to start /design ${dockItem.id}` }))),
        actions)));
  }

  /* queue */
  const eligible = open.filter((o) => o.id !== dockId && !o.blockedBy);
  const blocked = open.filter((o) => o.blockedBy);
  frag.append(el("div", { class: "seclabel" }, el("span", { class: "lbl", text: "Queue" }), el("span", { class: "cnt", text: `next candidates · ${eligible.length}` })));
  if (eligible.length) frag.append(el("div", { class: "rows" }, eligible.map(queueRow)));
  else frag.append(el("div", { class: "empty" }, "no eligible items.", el("span", { class: "cli mono", text: "pm add <KEY> <id> -p P2 --title …" })));
  if (blocked.length) {
    frag.append(el("div", { class: "subhead", text: "Blocked · earlier-order sibling open" }));
    frag.append(el("div", { class: "rows" }, blocked.map((o) => el("div", { class: "row blocked" },
      el("span", { class: "tick", text: "✕" }), pchip(o.priority), el("span", { class: "rid", text: o.id }),
      el("span", { class: "rtitle", text: o.title }), el("span", { class: "rtask", text: "by " + (o.blockedBy || "?") })))));
  }

  /* owners (collab visibility) — only when a collab item exists */
  const collabItems = open.filter((o) => o.mode === "collab");
  if (collabItems.length) {
    const byOwner = new Map();
    for (const o of collabItems) { const k = o.owner || "unassigned"; byOwner.set(k, (byOwner.get(k) || 0) + 1); }
    frag.append(el("div", { class: "subhead", text: "Owners · collab" }));
    frag.append(el("div", { class: "owners" }, [...byOwner.entries()].map(([owner, n]) =>
      el("span", { class: "ochip" }, el("span", { class: "odot" }), owner, el("b", { text: " " + n })))));
  }

  /* footer chips */
  let taskCount = "·"; try { taskCount = (await api("/api/tasks")).length; } catch {}
  frag.append(el("div", { class: "foot" },
    el("button", { class: "fchip", onclick: () => { location.hash = "#/inbox"; } }, el("span", { class: "lbl", text: "inbox" }), el("b", { text: String(next.inbox ?? 0) })),
    el("button", { class: "fchip", onclick: () => { location.hash = "#/tasks"; } }, el("span", { class: "lbl", text: "tasks" }), el("b", { text: String(taskCount) })),
    el("button", { class: "fchip", onclick: () => document.getElementById("validate").click() }, el("span", { class: "lbl", text: "validate" }), el("b", { class: "ok", text: "✓" }))));

  app.replaceChildren(frag);
}
function queueRow(o) {
  return el("div", { class: "row", role: "link", tabindex: "0",
    onclick: () => { location.hash = `#/item/${o.id}`; },
    onkeydown: (e) => { if (e.key === "Enter") location.hash = `#/item/${o.id}`; } },
    el("span", { class: "tick", text: "▸" }), pchip(o.priority),
    el("span", { class: "rid", text: o.id }), el("span", { class: "rtitle", text: o.title }),
    el("span", { class: "rtask", text: (o.owner && o.mode === "collab") ? "@" + o.owner : o.task }));
}

/* ---------- ITEM view ---------- */
async function renderItem(id) {
  setCrumb(id);
  app.replaceChildren(el("div", { class: "empty", text: "loading item…" }));
  let j;
  try { j = await api(`/api/roadmap/${id}/join`); }
  catch (e) { app.replaceChildren(el("div", { class: "empty" }, `item unavailable — ${e.message} `, el("button", { text: "back", onclick: () => { location.hash = "#/"; } }))); return; }
  const it = j.item, plan = j.plan;
  setCrumb({ text: it.task, href: `#/task/${it.task}` }, it.id);
  const frag = document.createDocumentFragment();
  frag.append(el("div", { class: "toolbar" },
    el("div", { class: "grp" }, el("button", { text: "← back", onclick: () => history.back() }), pchip(it.priority), el("span", { class: "id", text: it.id })),
    (j.closed
      ? el("span", { class: "chip p3", text: `closed · ${it.status || "done"}` })
      : el("div", { class: "grp" },
          el("button", { class: "primary", text: "copy kickoff →", onclick: () => copyKickoff(it.id) }),
          el("button", { text: "focus", onclick: () => mutate(() => api("/api/focus", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: it.id }) })) }),
          el("button", { class: "danger", text: "drop", onclick: () => dropItem(it.id) })))));

  const dl = el("dl", { class: "kv" });
  const kv = (k, v, mut) => { dl.append(el("dt", { text: k }), el("dd", { class: mut ? "mut" : "", text: v })); };
  kv("title", it.title); kv("status", it.status || "—");
  dl.append(el("dt", { text: "task" }), el("dd", {}, el("a", { href: `#/task/${it.task}`, class: "tasklink", text: it.task })));
  kv("mode", it.mode || "solo");
  if (it.owner) kv("owner", it.owner + (it.ownerNote ? ` — ${it.ownerNote}` : ""));
  if (it.note) kv("note", it.note, true);
  kv("plan", plan ? `${plan.path} (${plan.status})` : "— no plan", !plan);
  if (plan && plan.nextStep) kv("next step", cleanStep(plan.nextStep));
  frag.append(el("div", { class: "card" }, el("h3", { text: "detail" }), dl));

  frag.append(contextCard("context links", (j.contextLinks || []).map((l) =>
    el("div", { class: "prose" }, el("span", { class: "mono", text: l.label }), l.url ? document.createTextNode("  " + l.url) : null, l.by ? el("span", { class: "by", text: "@" + l.by }) : null,
      l.summary ? el("div", { class: "datehint", text: l.summary }) : null)), `no links · pm links add ${it.task} …`));
  frag.append(contextCard("context memory", (j.contextMemory || []).map((m) =>
    el("div", { class: "prose" }, el("span", { class: "mono", text: m.title }), m.date ? el("span", { class: "datehint", text: "  " + m.date }) : null, m.by ? el("span", { class: "by", text: "@" + m.by }) : null,
      el("div", { text: m.note }))), `no memory · pm memory add ${it.task} …`));

  app.replaceChildren(frag);
}
function contextCard(title, nodes, emptyHint) {
  return el("div", { class: "card" }, el("h3", { text: title }),
    nodes.length ? el("div", {}, nodes) : el("div", { class: "empty", style: "padding:6px 0" }, "none · ", el("span", { class: "cli mono", text: emptyHint })));
}
function dropItem(id) {
  if (!confirm(`Drop item "${id}"? This closes it as dropped.`)) return;
  mutate(async () => { await api(`/api/roadmap/${id}/drop`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ reason: "dropped via GUI" }) }); location.hash = "#/"; });
}

/* ---------- TASK view (drill: backlog / closed / links / memory) ---------- */
async function renderTask(key, tab = "backlog") {
  setCrumb(key);
  app.replaceChildren(el("div", { class: "empty", text: "loading task…" }));
  let roadmap, task;
  try { [roadmap, task] = await Promise.all([api("/api/roadmap"), api(`/api/tasks/${key}`)]); }
  catch (e) { app.replaceChildren(el("div", { class: "empty" }, `task unavailable — ${e.message} `, el("button", { text: "back", onclick: () => { location.hash = "#/"; } }))); return; }
  const backlog = (roadmap.open || []).filter((o) => o.task === key);
  const closed = (roadmap.recentlyClosed || []).filter((r) => r.task === key);
  const frag = document.createDocumentFragment();
  frag.append(el("div", { class: "toolbar" },
    el("div", { class: "grp" }, el("button", { text: "← back", onclick: () => history.back() }), el("span", { class: "id", text: key })),
    el("div", { class: "grp" }, el("button", { class: "danger", text: "archive task", onclick: () => archiveTask(key) }))));

  const tabnames = [["backlog", `backlog · ${backlog.length}`], ["closed", `closed · ${closed.length}`], ["links", `links · ${task.links.length}`], ["memory", `memory · ${task.memory.length}`]];
  frag.append(el("div", { class: "tabs", role: "tablist" }, tabnames.map(([t, lbl]) =>
    el("button", { role: "tab", "aria-selected": String(t === tab), text: lbl, onclick: () => { location.hash = `#/task/${key}/${t}`; } }))));

  const panel = el("div", { class: "panel" });
  if (tab === "backlog") panel.append(backlog.length ? el("div", { class: "rows" }, backlog.map(queueRow)) : emptyCli("no open items", `pm add ${key} <id> -p P2 --title …`));
  else if (tab === "closed") panel.append(closed.length ? el("div", { class: "rows" }, closed.map(closedRow)) : emptyCli("no recently-closed items", `pm close ${key} <id> --status done`));
  else if (tab === "links") panel.append(editor(key, "links", task.links));
  else if (tab === "memory") panel.append(editor(key, "memory", task.memory));
  frag.append(panel);
  app.replaceChildren(frag);
}
function closedRow(r) {
  return el("div", { class: "row", role: "link", tabindex: "0", onclick: () => { location.hash = `#/item/${r.id}`; } },
    el("span", { class: "tick", text: "✓" }), el("span", { class: "chip p3", text: r.status || "done" }),
    el("span", { class: "rid", text: r.id }), el("span", { class: "rtitle", text: r.note || "" }), el("span", { class: "rtask", text: r.closed || "" }));
}
function emptyCli(msg, cli) { return el("div", { class: "empty" }, msg + " · ", el("span", { class: "cli mono", text: cli })); }

/* links/memory editor — full-state PUT; By is display-only (server merges by id). No optimistic UI. */
function editor(key, kind, items) {
  const box = el("div", {});
  const list = el("div", {});
  const model = items.map((x) => ({ ...x }));
  function draw() {
    list.replaceChildren();
    model.forEach((m, i) => {
      const head = el("div", { class: "head" },
        el("input", kind === "links" ? { value: m.label || "", placeholder: "label", oninput: (e) => (m.label = e.target.value) } : { value: m.title || "", placeholder: "title", oninput: (e) => (m.title = e.target.value) }),
        m.by ? el("span", { class: "by", text: "@" + m.by }) : null,
        el("button", { text: "✕", onclick: () => { model.splice(i, 1); draw(); } }));
      const fields = kind === "links"
        ? [field("url", el("input", { value: m.url || "", placeholder: "https://", oninput: (e) => (m.url = e.target.value) })),
           field("triggers (comma)", el("input", { value: (m.triggers || []).join(", "), oninput: (e) => (m.triggers = e.target.value.split(",").map((s) => s.trim()).filter(Boolean)) })),
           field("summary", el("textarea", { oninput: (e) => (m.summary = e.target.value) }, m.summary || ""))]
        : [field("note", el("textarea", { oninput: (e) => (m.note = e.target.value) }, m.note || "")),
           field("date", el("input", { value: m.date || "", placeholder: "YYYY-MM-DD", oninput: (e) => (m.date = e.target.value) }))];
      list.append(el("div", { class: "edit-row" }, head, ...fields));
    });
  }
  function field(label, input) { return el("div", {}, el("label", { text: label }), input); }
  draw();
  box.append(list, el("div", { class: "grp", style: "display:flex;gap:9px;margin-top:8px" },
    el("button", { text: `+ add ${kind === "links" ? "link" : "memory"}`, onclick: () => { model.push(kind === "links" ? { label: "", url: "", triggers: [], summary: "" } : { title: "", note: "", date: "" }); draw(); } }),
    el("button", { class: "primary", text: "save", onclick: () => saveEditor(key, kind, model) })));
  return box;
}
async function saveEditor(key, kind, model) {
  clearBanner();
  try {
    const cur = await api(`/api/tasks/${key}`);
    const payload = { links: cur.links, memory: cur.memory };
    payload[kind] = model;
    await api(`/api/tasks/${key}`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    await route();
  } catch (e) { showConflict(e); }
}
function archiveTask(key) {
  if (!confirm(`Archive task "${key}"? Refused if it still has open items.`)) return;
  mutate(async () => { await api(`/api/tasks/${key}`, { method: "DELETE" }); location.hash = "#/"; });
}

/* ---------- INBOX (read-only; triage is CLI-only) ---------- */
async function renderInbox() {
  setCrumb("inbox");
  app.replaceChildren(el("div", { class: "empty", text: "loading inbox…" }));
  let items; try { items = await api("/api/inbox"); } catch (e) { app.replaceChildren(el("div", { class: "empty", text: "inbox unavailable — " + e.message })); return; }
  const frag = document.createDocumentFragment();
  frag.append(el("div", { class: "toolbar" }, el("div", { class: "grp" }, el("button", { text: "← back", onclick: () => history.back() }), el("span", { class: "id", text: "inbox" }))));
  if (!items.length) { frag.append(emptyCli("inbox clear — nothing to triage", "pm triage <id> <KEY>")); }
  else {
    frag.append(el("div", { class: "rows" }, items.map((b) => el("div", { class: "row", style: "cursor:default" },
      el("span", { class: "tick", text: "•" }), pchip(b.priority || "P3"), el("span", { class: "rid", text: b.id }),
      el("span", { class: "rtitle", text: b.title || b.note || "" }), el("span", { class: "rtask", text: "" })))));
    frag.append(el("div", { class: "empty", style: "padding-top:14px" }, "triage is CLI-only · ", el("span", { class: "cli mono", text: "pm triage <id> <KEY>" })));
  }
  app.replaceChildren(frag);
}

/* ---------- TASKS index (read; drill target) ---------- */
async function renderTasks() {
  setCrumb("tasks");
  app.replaceChildren(el("div", { class: "empty", text: "loading tasks…" }));
  let tasks; try { tasks = await api("/api/tasks"); } catch (e) { app.replaceChildren(el("div", { class: "empty", text: "tasks unavailable — " + e.message })); return; }
  const frag = document.createDocumentFragment();
  frag.append(el("div", { class: "toolbar" }, el("div", { class: "grp" }, el("button", { text: "← back", onclick: () => history.back() }), el("span", { class: "id", text: "tasks" }))));
  frag.append(tasks.length ? el("div", { class: "rows" }, tasks.map((t) => el("div", { class: "row", role: "link", tabindex: "0", onclick: () => { location.hash = `#/task/${t.key}`; } },
    el("span", { class: "tick", text: "▸" }), el("span", {}), el("span", { class: "rid", text: t.key }),
    el("span", { class: "rtitle", text: `${t.linkCount} links · ${t.memCount} memory` }), el("span", { class: "rtask", text: "" }))))
    : emptyCli("no active tasks", "pm task create <KEY> --title …"));
  app.replaceChildren(frag);
}

/* ---------- router ---------- */
async function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const seg = h.split("/").map(decodeURIComponent);
  if (seg[0] === "item" && seg[1]) return renderItem(seg[1]);
  if (seg[0] === "task" && seg[1]) return renderTask(seg[1], seg[2] || "backlog");
  if (seg[0] === "inbox") return renderInbox();
  if (seg[0] === "tasks") return renderTasks();
  return renderHome();
}
document.getElementById("validate").addEventListener("click", loadValidate);
document.getElementById("validate").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") loadValidate(); });
window.addEventListener("hashchange", route);
route();
</script>
