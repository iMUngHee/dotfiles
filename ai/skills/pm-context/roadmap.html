<template data-view="now"></template>
<template data-view="tasks"></template>
<template data-view="task"></template>
<template data-view="item"></template>

<script type="module">
const workspace = document.getElementById("workspace");

const state = { roadmap: null, next: null, tasks: [], actor: null, validation: null, inbox: null, errors: {}, routeToken: 0 };

function el(tag, props = {}, ...children) {

  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child.nodeType ? child : document.createTextNode(String(child)));

}

function routeParams() { return new URLSearchParams(location.search); }

}

function renderSearchResults() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query || !document.activeElement || document.activeElement !== searchInput) { searchResults.hidden = true; searchResults.replaceChildren(); return; }
  const taskMatches = state.tasks.filter((task) => `${task.key} ${task.title}`.toLowerCase().includes(query)).slice(0, 5);
  const itemMatches = (state.roadmap?.open || []).filter((item) => `${item.id} ${item.title} ${item.note || ""} ${item.owner || ""}`.toLowerCase().includes(query)).slice(0, 7);
  const rows = [
    ...taskMatches.map((task) => searchResult("Task", task.key, task.title, routeHref("task", { task: task.key, tab: "overview", q: searchInput.value.trim() }))),
    ...itemMatches.map((item) => searchResult("Item", item.id, item.title, routeHref("item", { item: item.id, q: searchInput.value.trim() }))),
  ];

}
function searchResult(kind, id, title, href) {

}
let searchTimer;
searchInput.addEventListener("input", () => {

  searchTimer = setTimeout(() => {
    const params = routeParams();
    if (searchInput.value.trim()) params.set("q", searchInput.value.trim()); else params.delete("q");
    history.replaceState({}, "", `${location.pathname}${params.toString() ? `?${params}` : ""}`);
    renderSearchResults();
  }, 90);
});
searchInput.addEventListener("focus", renderSearchResults);
searchInput.addEventListener("keydown", (event) => { if (event.key === "Escape") { searchResults.hidden = true; searchInput.blur(); } });
document.addEventListener("keydown", (event) => { if (event.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) { event.preventDefault(); searchInput.focus(); } });
document.addEventListener("click", (event) => { if (!event.target.closest(".global-search")) searchResults.hidden = true; });

  workspace.replaceChildren(el("div", { class: "skeleton" }), el("div", { class: "skeleton" }), el("div", { class: "skeleton" }));
  contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Context" }), el("div", { class: "skeleton" }), el("div", { class: "skeleton" }));
}
function fullConnectionError() {
  workspace.replaceChildren(pageHead("Task Desk is unavailable", "The dashboard could not read the PM store. Your route and filters are still preserved."),
    el("div", { class: "panel danger" }, el("strong", { text: "Connection failed" }), el("p", { class: "muted", text: state.errors.roadmap?.message || state.errors.tasks?.message || "Unknown server error" }), el("button", { class: "btn primary", type: "button", text: "Retry connection", onclick: renderRoute })));
  contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Recovery" }), el("p", { class: "muted", text: "Keep this page open and retry after the PM server is available." }));
}

async function renderRoute() {
  const token = ++state.routeToken;
  skeletonPage();
  searchInput.value = routeParams().get("q") || "";
  await fetchBase();
  if (token !== state.routeToken) return;
  if (state.errors.roadmap && state.errors.tasks) return fullConnectionError();
  const view = currentView();
  try {
    if (view === "now") await renderNow();
    else if (view === "tasks") await renderTasks();
    else if (view === "task") await renderTaskWorkspace();
    else if (view === "item") await renderItemDetail();
    else if (view === "people") await renderPeople();
    else if (view === "health") await renderHealth();
    else renderNotFound(view);
  } catch (error) {
    workspace.replaceChildren(pageHead("This view is unavailable", "Other dashboard areas may still be used."), el("div", { class: "panel danger" }, el("strong", { text: error.message || String(error) }), el("div", { class: "button-row", style: "margin-top:14px" }, el("button", { class: "btn", type: "button", text: "Retry this view", onclick: renderRoute }), routeLink("Back to Now", "now"))));
    contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Partial read failure" }), el("p", { class: "muted", text: "The rest of the shell remains available." }));

}

async function renderNow() {
  const roadmap = state.roadmap;
  const next = state.next;
  workspace.replaceChildren(pageHead("Now", "Resume the selected plan, or explicitly choose an eligible Item. Nothing here is selected automatically."));
  workspace.append(renderCurrentPlan(roadmap?.currentPlan));
  if (state.errors.next) workspace.append(el("div", { class: "panel danger" }, el("strong", { text: "Candidate list unavailable" }), el("p", { class: "muted", text: state.errors.next.message }), el("button", { class: "btn", type: "button", text: "Retry", onclick: renderRoute })));

    workspace.append(sectionHead("Eligible next", `${eligible.length} candidates`), eligible.length ? workList(eligible, { simple: true }) : emptyState("No eligible work", searchInput.value ? "No candidate matches the active search." : "Create an Item or resolve a blocker to continue.", "pm item add <TASK> <id> --title <title>"));
    workspace.append(sectionHead("Blocked", `${blocked.length} items`), blocked.length ? workList(blocked, { simple: true, blocked: true }) : emptyState("No blocked work", "Dependency checks found no blocked Items."));
  }

    stat("Open Items", roadmap?.open?.length ?? "—"), stat("Inbox", state.inbox?.length ?? next?.inbox ?? "—"), stat("Validation", state.errors.validation ? "Unavailable" : `${state.validation?.errors?.length || 0} / ${state.validation?.warnings?.length || 0}`, "errors / warnings")));

async function renderTasks() {

  else workspace.append(el("div", { class: "work-list" }, state.inbox.map((item) => el("article", { class: "work-row" }, priorityMark(item.priority), el("span", { class: "mono muted", text: item.id }), el("div", { class: "work-title" }, el("strong", { text: item.title }), el("small", { text: item.note || "No note" })), el("span", { class: "work-owner", text: "Needs CLI triage" }), el("div")))));
  contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Recovery commands" }), el("h2", { text: "Authoritative CLI" }), contextItem("Validate", "pm validate"), contextItem("Triage inbox", "pm inbox triage <id> --task <KEY>"), contextItem("Inspect current plan", "pm current-plan"));
}
function formatIssue(issue) { return typeof issue === "string" ? issue : JSON.stringify(issue); }

  workspace.replaceChildren(pageHead("Route not found", `The requested ${view} view cannot be opened.`), el("div", { class: "panel warning" }, el("strong", { text: detail }), el("div", { class: "button-row", style: "margin-top:14px" }, routeLink("Back to Now", "now", {}, "btn primary"), routeLink("Browse Tasks", "tasks"))));
  contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Navigation" }), el("p", { class: "muted", text: "Routes use query parameters so refresh and browser history remain stable." }));

async function renderContextFor(taskKey) {
  if (!taskKey) {
    contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Context" }), el("h2", { text: "No Task in execution" }), el("p", { class: "muted", text: "Select a Task to keep its links and recent memory beside the workspace." }), routeLink("Browse Tasks", "tasks"));

  catch (error) { contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Context unavailable" }), el("p", { class: "danger-text", text: error.message }), el("button", { class: "btn", type: "button", text: "Retry context", onclick: renderRoute })); }
}
function renderContextRail(task, options = {}) {
  const links = task.links || [];
  const memory = [...(task.memory || [])].sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))).slice(0, 3);
  contextRail.replaceChildren(el("p", { class: "eyebrow", text: "Task context" }), el("div", { class: "panel-head" }, el("div", {}, el("h2", { class: "mono", text: task.key }), task.title === task.key ? null : el("p", { text: task.title })), el("span", { class: "task-wide", text: "Task-wide" })),
    el("div", { class: "context-group" }, el("div", { class: "panel-head" }, el("h3", { text: "Links" }), el("span", { class: "muted", text: links.length })), links.length ? links.slice(0, 5).map(linkView) : el("p", { class: "muted", text: "No Task links." })),
    el("div", { class: "context-group" }, el("div", { class: "panel-head" }, el("h3", { text: "Recent memory" }), el("span", { class: "muted", text: memory.length })), memory.length ? memory.map(memoryView) : el("p", { class: "muted", text: "No Task memory." })),

function linkView(link) {

  return el("div", { class: "context-item" }, href ? el("a", { href, target: "_blank", rel: "noreferrer", text: link.label }) : el("strong", { text: link.label }), el("p", { text: link.summary || link.url || "No summary" }), link.by ? el("span", { class: "muted", text: `By ${link.by}` }) : null);
}
function memoryView(memory) { return el("div", { class: "context-item" }, el("strong", { text: memory.title }), el("p", { text: memory.note || "No note" }), el("span", { class: "muted", text: [memory.date, memory.by ? `By ${memory.by}` : ""].filter(Boolean).join(" · ") })); }

async function copyPrompt(endpoint, button) {
  clearAlert(); const previous = button.textContent; button.disabled = true; button.textContent = "Preparing…";
  try {
    const prompt = await api(endpoint);
    try { await navigator.clipboard.writeText(prompt); announce("Prompt copied to clipboard"); }
    catch { showPromptFallback(prompt); }
  } catch (error) { showAlert(error, "Prompt unavailable"); }
  finally { if (button.isConnected) { button.disabled = false; button.textContent = previous; } }
}
function showPromptFallback(prompt) {
  const dialog = document.getElementById("prompt-dialog"); const textarea = document.getElementById("prompt-text"); textarea.value = prompt; dialog.showModal(); queueMicrotask(() => textarea.select());
}
document.getElementById("retry-copy").addEventListener("click", async (event) => {
  event.preventDefault(); const text = document.getElementById("prompt-text").value;
  try { await navigator.clipboard.writeText(text); document.getElementById("prompt-dialog").close(); announce("Prompt copied to clipboard"); } catch { document.getElementById("prompt-text").select(); }
});

function askConfirm({ title, message, confirmLabel, reason = false }) {
  const dialog = document.getElementById("confirm-dialog"); const form = document.getElementById("confirm-form"); const reasonWrap = document.getElementById("confirm-reason-wrap"); const reasonInput = document.getElementById("confirm-reason");
  document.getElementById("confirm-title").textContent = title; document.getElementById("confirm-message").textContent = message; document.getElementById("confirm-action").textContent = confirmLabel; reasonWrap.hidden = !reason; reasonInput.required = reason; reasonInput.value = "";
  return new Promise((resolve) => { const finish = () => { dialog.removeEventListener("close", finish); resolve(dialog.returnValue === "confirm" ? { confirmed: true, reason: reasonInput.value.trim() } : { confirmed: false }); }; dialog.addEventListener("close", finish); dialog.showModal(); queueMicrotask(() => (reason ? reasonInput : form.querySelector("[value=cancel]")).focus()); });
}
async function dropItem(item) {
  const answer = await askConfirm({ title: `Drop ${item.id}?`, message: "This moves the planless Item to closed history. A linked plan must be handled from the CLI.", confirmLabel: "Drop Item", reason: true });
  if (!answer.confirmed) return;
  const trigger = document.querySelector("button.danger");
  try { await pending(trigger, "Dropping…", () => api(`/api/roadmap/${item.id}/drop`, { method: "POST", body: jsonBody({ reason: answer.reason }) }), `${item.id} dropped`); navigate(routeHref("task", { task: item.task, tab: "history" }), { replace: true }); } catch {}
}
async function archiveTask(task, trigger) {
  const answer = await askConfirm({ title: `Archive ${task.key}?`, message: "Archiving preserves Task data and is refused while open Items remain.", confirmLabel: "Archive Task" });
  if (!answer.confirmed) return;
  try { await pending(trigger, "Archiving…", () => api(`/api/tasks/${task.key}`, { method: "DELETE" }), `${task.key} archived`); navigate(routeHref("tasks"), { replace: true }); } catch {}

async function handoffItem(item) {
  const dialog = document.getElementById("handoff-dialog"); const form = document.getElementById("handoff-form"); const owner = document.getElementById("handoff-owner"); const note = document.getElementById("handoff-note"); const errorBox = document.getElementById("handoff-error");
  owner.value = ""; note.value = ""; errorBox.textContent = ""; document.getElementById("handoff-message").textContent = `Current owner: ${item.owner}. The server will reject a stale handoff.`; dialog.showModal(); queueMicrotask(() => owner.focus());
  const onClose = async () => {
    dialog.removeEventListener("close", onClose);
    if (dialog.returnValue !== "confirm") return;
    if (!owner.value.trim()) { errorBox.textContent = "New owner is required."; return; }
    try { await api(`/api/roadmap/${item.id}/handoff`, { method: "POST", body: jsonBody({ expectedOwner: item.owner, owner: owner.value.trim(), note: note.value.trim() }) }); announce(`${item.id} handed off to ${owner.value.trim()}`); await renderRoute(); }
    catch (error) { showAlert(error); }
  };
  dialog.addEventListener("close", onClose);
}

document.getElementById("menu-button").addEventListener("click", () => navDrawer.showModal());
document.getElementById("drawer-close").addEventListener("click", () => navDrawer.close());
document.getElementById("confirm-dialog").addEventListener("click", (event) => { if (event.target === event.currentTarget) event.currentTarget.close("cancel"); });
document.getElementById("handoff-dialog").addEventListener("click", (event) => { if (event.target === event.currentTarget) event.currentTarget.close("cancel"); });
document.getElementById("prompt-dialog").addEventListener("click", (event) => { if (event.target === event.currentTarget) event.currentTarget.close("cancel"); });

renderRoute();
</script>
